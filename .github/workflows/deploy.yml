name: Deploy to Azure App Service

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read     # download the artifact produced by the CI run
  id-token: write   # OIDC login to Azure (no long-lived secret)

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only deploy a successful CI run on main (or a manual trigger), and only once the app name is configured.
    if: >-
      vars.AZURE_WEBAPP_NAME != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}

    steps:
      - name: Download artifact from CI run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: azurecarrental
          path: ./publish
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Checkout (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7

      - name: Setup .NET (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Publish (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: dotnet publish AzureCarRental.csproj --configuration Release --output ./publish

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ./publish

      - name: Azure logout
        if: always()
        run: az logout || true
