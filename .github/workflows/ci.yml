name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '9.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build & publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore AzureCarRental.sln

      - name: Build
        run: dotnet build AzureCarRental.sln --configuration Release --no-restore

      - name: Check formatting
        # Informative for now: does not fail the build until the codebase is formatted.
        continue-on-error: true
        run: dotnet format AzureCarRental.sln --verify-no-changes --no-restore

      - name: Check vulnerable packages
        run: |
          dotnet list AzureCarRental.sln package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q -i "has the following vulnerable packages" vulnerable.txt; then
            echo "::warning::Vulnerable NuGet packages detected, see the log above."
          fi

      - name: Publish
        run: dotnet publish AzureCarRental.csproj --configuration Release --no-build --output ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: azurecarrental
          path: ./publish
          retention-days: 7
          if-no-files-found: error
